name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-npm-package:
    name: Verify npm package (npx/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npx
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Verify package installs cleanly
        run: npm pack --dry-run

      - name: Sanity-check installer entrypoint exists
        run: test -f bin/install.js

  # This job's `name` is load-bearing: branch protection matches required checks
  # by their displayed name, so renaming it silently blocks every pull request
  # against a context that will never report again. Levels 2-3 went into a
  # second job for that reason rather than a second step here.
  validate-artifacts:
    name: Run Level 1 structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Level 1 -- every artifact, structural
        # `--all` rather than a find loop per type. The loops it replaces
        # covered knowledge/, skills/ and references/ and therefore never saw
        # workflows/ or the entry point: a WORKFLOW.md with an invalid version
        # passed CI until 2026-08-08. `--all` reads each file's own
        # `artifact_type`, which is also the only way the entry point gets
        # validated as an entry rather than skipped for not being a Skill.
        run: python3 scripts/validate_artifact.py . --all

  validate-repository:
    name: Run Levels 2-3 repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Levels 2-3 -- ids, edges, the DAG, routing, index sync
        # docs/validation-model.md marks these blocking, and they were not run
        # here at all until 2026-08-08 -- sixteen repository-wide checks that
        # existed only on the machine of whoever remembered to run them.
        run: python3 scripts/validate_repo.py .

      - name: Tests for the validators themselves
        # A check that stops working should fail a test rather than go quiet.
        run: python3 -m unittest discover tests/

  check-transitions:
    name: Check lifecycle transitions
    # Only on a pull request: a transition exists between two versions of a
    # file, so there is nothing to compare on a push to main -- the merge has
    # already happened. See scripts/check_transitions.py for why this is not a
    # nineteenth check in validate_repo.py.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit has to be in the clone for `git show` to reach it.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Every status change is one the lifecycle allows
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/check_transitions.py . --base "origin/${{ github.base_ref }}"
